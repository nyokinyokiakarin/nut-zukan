<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6dc58">
<title>ぬい図鑑</title>
<style>
:root{--paper:#fffdf4;--ink:#29281f;--line:#d8d1ae;--yellow:#f6dc58;--green:#a8c96b;--soft:#f7f0cf;--danger:#a83e35}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:920px;margin:auto;padding:18px 14px 72px}header{position:sticky;top:0;z-index:5;background:rgba(255,253,244,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 0 12px}.head{display:flex;gap:12px;align-items:center;justify-content:space-between}h1{font-size:25px;margin:0}.sub{font-size:12px;opacity:.65;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap}button,.fileBtn{appearance:none;border:1px solid #a49b70;background:#fff;color:var(--ink);border-radius:999px;padding:9px 12px;font:inherit;font-weight:700}.primary{background:var(--yellow)}.add{background:var(--green)}.fileBtn input{display:none}.notice{background:var(--soft);border:1px solid var(--line);padding:12px 14px;border-radius:15px;margin:14px 0;font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}.card{border:1px solid var(--line);border-radius:19px;background:#fff;overflow:hidden;box-shadow:0 4px 14px rgba(65,58,29,.06)}.photo{aspect-ratio:1/1;background:#eee9d7;display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo span{opacity:.5;font-weight:700}.body{padding:13px}.name{font-size:19px;font-weight:800}.meta{font-size:13px;opacity:.7;margin-top:3px}.memo{white-space:pre-wrap;font-size:14px;line-height:1.55;margin-top:9px}.editOnly{display:none}.editing .editOnly{display:inline-block}.editing .viewOnly{display:none}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}.field input,.field textarea{width:100%;font:inherit;border:1px solid #bbb28b;border-radius:10px;padding:9px;background:#fff}.field textarea{min-height:70px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1}.danger{color:var(--danger);border-color:#d1a09b}.empty{text-align:center;padding:52px 8px;opacity:.65}.tiny{font-size:11px;opacity:.6;line-height:1.5;margin-top:12px}@media(max-width:600px){.head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr 1fr}.body{padding:10px}.name{font-size:17px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<header><div class="head"><div><h1>ぬい図鑑</h1><div class="sub">写真と名前を、あかり自身で結びつける図鑑</div></div><div class="actions"><button id="editBtn" class="primary">編集する</button><button id="addBtn" class="add editOnly">＋ この子を登録</button><button id="exportBtn" class="editOnly">バックアップ</button><label class="fileBtn editOnly">復元<input id="importFile" type="file" accept="application/json"></label></div></div></header>
<div class="notice">編集するを押すと、写真・キャラクター・長男/次男など・呼び名・お迎え日・見分けポイントを登録できます。写真だけで自動判定せず、あかりが決めた個体情報をそのまま保存します。</div>
<div id="grid" class="grid"></div><div id="empty" class="empty">まだ誰も登録されてないぞ。<br>「編集する」→「＋ この子を登録」で一人目を作ろう！</div>
<div class="tiny">この試作版の登録内容は、開いた端末のブラウザ内に保存されます。「バックアップ」でJSONファイルとして保存できます。</div>
</div>
<script>
const KEY='nut-zukan-v1';let editing=false,data=load();const grid=document.getElementById('grid'),empty=document.getElementById('empty');
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){document.body.classList.toggle('editing',editing);document.getElementById('editBtn').textContent=editing?'編集を終わる':'編集する';empty.style.display=data.length?'none':'block';grid.innerHTML=data.map((x,i)=>`<article class="card"><div class="photo">${x.photo?`<img src="${x.photo}" alt="${esc(x.name||x.order||'ぬい')}">`:'<span>写真なし</span>'}</div><div class="body"><div class="viewOnly"><div class="name">${esc(x.name||x.order||'なまえ未設定')}</div><div class="meta">${[x.character,x.order,x.date].filter(Boolean).map(esc).join(' ・ ')}</div>${x.memo?`<div class="memo">${esc(x.memo)}</div>`:''}</div><div class="editOnly"><div class="field"><label>写真</label><input type="file" accept="image/*" onchange="photo(${i},this)"></div><div class="row"><div class="field"><label>キャラクター</label><input value="${esc(x.character)}" placeholder="帝統" oninput="setv(${i},'character',this.value)"></div><div class="field"><label>何男・何女？</label><input value="${esc(x.order)}" placeholder="長男" oninput="setv(${i},'order',this.value)"></div></div><div class="field"><label>呼び名</label><input value="${esc(x.name)}" placeholder="ピコ" oninput="setv(${i},'name',this.value)"></div><div class="field"><label>お迎え日</label><input type="date" value="${esc(x.date)}" oninput="setv(${i},'date',this.value)"></div><div class="field"><label>見分けポイント・メモ</label><textarea placeholder="目、毛並み、服、思い出など" oninput="setv(${i},'memo',this.value)">${esc(x.memo)}</textarea></div><button class="danger" onclick="delEntry(${i})">この子を削除</button></div></div></article>`).join('')}
window.setv=(i,k,v)=>{data[i][k]=v;localStorage.setItem(KEY,JSON.stringify(data))};window.delEntry=i=>{if(confirm('この登録を削除する？')){data.splice(i,1);persist()}};
window.photo=(i,input)=>{const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=800,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);data[i].photo=c.toDataURL('image/jpeg',.78);try{persist()}catch(e){alert('写真が大きすぎて保存できなかった。別の写真か、少ない枚数で試してみて！')}};img.src=r.result};r.readAsDataURL(f)};
document.getElementById('editBtn').onclick=()=>{editing=!editing;render()};document.getElementById('addBtn').onclick=()=>{data.unshift({character:'',order:'',name:'',date:'',memo:'',photo:''});persist();scrollTo({top:0,behavior:'smooth'})};
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,entries:data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nut-zukan-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),arr=Array.isArray(j)?j:j.entries;if(!Array.isArray(arr))throw 0;if(confirm('今の図鑑を、読み込んだデータで置き換える？')){data=arr;persist()}}catch(_){alert('このファイルは読み込めなかった！')}};r.readAsText(f)};render();
</script></body></html>
